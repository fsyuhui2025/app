<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A股妖股榜 · 2021-2026 连板牛股回顾</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0e14'/%3E%3Cpath d='M6 21l6-8 4 4 5-9 5 13' stroke='%23e8484f' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='25.5' cy='12.5' r='1.8' fill='%23ffb020'/%3E%3C/svg%3E">
<script>
(function(){
  try{
    var t = localStorage.getItem("ag-theme");
    document.documentElement.dataset.theme = (t === "light") ? "light" : "dark";
  }catch(e){ document.documentElement.dataset.theme = "dark"; }
})();
</script>
<style>
:root, html[data-theme="dark"]{
  --bg:#0b0e14; --bg2:#0f131c; --panel:#141a26; --panel2:#182034;
  --line:#232c40; --line2:#2c3750;
  --txt:#e8ebf2; --mut:#8b95a9; --dim:#5c6681;
  --red:#f0474f; --redbg:rgba(240,71,79,.13);
  --green:#20c380; --greenbg:rgba(32,195,128,.13);
  --gold:#ffb020; --goldbg:rgba(255,176,32,.12);
  --blue:#5b8cff; --bluebg:rgba(91,140,255,.12);
  --hover:rgba(91,140,255,.08);
  --flash:rgba(255,176,32,.25);
  --shadow:0 12px 34px rgba(0,0,0,.5);
  --mono:"SF Mono","JetBrains Mono","Roboto Mono",Consolas,"Courier New",monospace;
}
html[data-theme="light"]{
  --bg:#f4f6fa; --bg2:#eef1f7; --panel:#ffffff; --panel2:#f2f5fa;
  --line:#e3e8f0; --line2:#d3dae6;
  --txt:#1a2233; --mut:#5c6a82; --dim:#8b95a9;
  --red:#d92b34; --redbg:rgba(217,43,52,.10);
  --green:#0e9f6e; --greenbg:rgba(14,159,110,.10);
  --gold:#b57400; --goldbg:rgba(255,176,32,.18);
  --blue:#2f66e8; --bluebg:rgba(47,102,232,.10);
  --hover:rgba(47,102,232,.06);
  --flash:rgba(255,176,32,.35);
  --shadow:0 12px 30px rgba(15,23,42,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--txt);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  min-height:100vh;transition:background .2s,color .2s;
}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
.wrap{max-width:1440px;margin:0 auto;padding:0 18px 60px}

/* ===== 顶栏 ===== */
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  padding:22px 0 16px;border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{
  width:40px;height:40px;border-radius:10px;flex:none;
  background:linear-gradient(135deg,var(--panel2),var(--bg2));
  border:1px solid var(--line2);display:grid;place-items:center;
}
.brand h1{font-size:21px;font-weight:800;letter-spacing:.5px;white-space:nowrap}
.brand h1 em{font-style:normal;color:var(--red)}
.brand .sub{font-size:12px;color:var(--mut);margin-top:2px;white-space:nowrap}
.top-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tdx-link{
  display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:8px;
  background:var(--goldbg);border:1px solid rgba(255,176,32,.35);color:var(--gold);
  font-size:13px;font-weight:600;transition:background .15s;
}
.tdx-link:hover{background:rgba(255,176,32,.2)}
.tdx-link svg{width:15px;height:15px;flex:none}
.action-btn{
  display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:8px;
  background:var(--bg2);border:1px solid var(--line2);color:var(--mut);
  font-size:13px;font-weight:600;transition:color .15s,border-color .15s;
}
.action-btn:hover{color:var(--txt);border-color:var(--blue)}
.theme-btn{
  display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:8px;
  background:var(--bg2);border:1px solid var(--line2);color:var(--mut);
  font-size:13px;font-weight:600;transition:color .15s,border-color .15s;
}
.theme-btn:hover{color:var(--txt);border-color:var(--blue)}
.theme-btn svg{width:15px;height:15px;flex:none}
html[data-theme="dark"] .theme-btn .ico-sun{display:none}
html[data-theme="light"] .theme-btn .ico-moon{display:none}

/* ===== 工具面板 ===== */
.data-panel{
  background:var(--panel); border:1px solid var(--line); border-radius:12px;
  margin:18px 0; padding:16px; display:none;
}
.data-panel .panel-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
.data-panel .panel-title{font-size:14px; font-weight:700;}
.data-panel .btn-close{background:none; border:none; color:var(--mut); font-size:16px; cursor:pointer;}
.data-panel .tool-log{
  background:var(--bg2); padding:12px; border-radius:8px; font-family:var(--mono);
  font-size:13px; color:var(--green); max-height:200px; overflow-y:auto; margin-bottom:12px; white-space:pre-wrap;
}
.data-panel .tool-json-box{display:none;}
.data-panel .tool-json-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
.data-panel .tool-json-title{font-size:12px; color:var(--mut); font-weight:bold;}
.data-panel textarea{
  width:100%; height:150px; background:var(--bg2); color:var(--green); border:1px solid var(--line2);
  border-radius:6px; padding:10px; font-family:var(--mono); font-size:12px; resize:vertical; outline:none; line-height:1.4;
}

/* ===== 可折叠概览 ===== */
.overview{margin:18px 0}
.fold-head{
  width:100%;display:flex;align-items:center;gap:10px;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:12px 16px;color:var(--txt);text-align:left;transition:border-color .15s;
}
.fold-head:hover{border-color:var(--line2)}
.fold-head .chev{width:16px;height:16px;color:var(--mut);transition:transform .2s;flex:none}
.fold-head[aria-expanded="true"] .chev{transform:rotate(180deg)}
.fold-title{font-weight:700;font-size:14px}
.fold-desc{font-size:12px;color:var(--dim)}
.fold-tag{margin-left:auto;font-size:12px;color:var(--blue);white-space:nowrap}
.fold-body{margin-top:12px}

/* ===== 统计卡片 ===== */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 12px}
.stat{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;position:relative;overflow:hidden;
}
.stat::after{content:"";position:absolute;inset:auto 0 0 0;height:2px;background:var(--c,var(--red))}
.stat .k{font-size:12px;color:var(--mut)}
.stat .v{font-size:26px;font-weight:800;font-family:var(--mono);margin-top:4px;letter-spacing:.3px}
.stat .v small{font-size:13px;font-weight:600;color:var(--mut);margin-left:4px}
.stat .d{font-size:11px;color:var(--dim);margin-top:3px}

/* ===== 图表 ===== */
.charts{display:grid;grid-template-columns:1.25fr 1fr;gap:12px;margin-bottom:18px}
.chart{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
}
.chart h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.chart h3 svg{width:14px;height:14px;color:var(--red)}
.chart .hint{font-size:11px;color:var(--dim);margin:2px 0 8px}
.cv{width:100%;height:230px}
.fallback{display:none}
.chart.no-echarts .cv{display:none}
.chart.no-echarts .fallback{display:block}
.fb-list{display:grid;gap:7px;margin-top:8px}
.fb-row{display:grid;grid-template-columns:70px 1fr 44px;gap:8px;align-items:center;font-size:12px}
.fb-row .bar{height:12px;border-radius:3px;background:linear-gradient(90deg,var(--red),rgba(240,71,79,.35));min-width:4px}
.fb-row .n{color:var(--mut);font-family:var(--mono);text-align:right}
.fb-row .l{color:var(--txt)}

/* ===== 工具栏 ===== */
.toolbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;
}
.search{position:relative;flex:1 1 220px;min-width:180px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--dim)}
.search input{
  width:100%;height:38px;padding:0 12px 0 34px;border-radius:8px;
  background:var(--bg2);border:1px solid var(--line2);color:var(--txt);font-size:14px;outline:none;
}
.search input:focus{border-color:var(--blue)}
select{
  height:38px;padding:0 10px;border-radius:8px;background:var(--bg2);border:1px solid var(--line2);
  color:var(--txt);font-size:13px;outline:none;cursor:pointer;
}
.sort-ctl{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut)}
.live-toggle{
  display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:8px;
  border:1px solid var(--line2);background:var(--bg2);font-size:13px;color:var(--mut);
}
.live-toggle .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);transition:background .2s}
.live-toggle.on{color:var(--green);border-color:rgba(32,195,128,.4)}
.live-toggle.on .dot{background:var(--green);box-shadow:0 0 6px rgba(32,195,128,.7)}
.live-toggle .st{font-size:11px}
.pager{display:flex;align-items:center;gap:6px;margin-left:auto}
.pager button{
  width:32px;height:32px;border-radius:7px;border:1px solid var(--line2);background:var(--bg2);
  color:var(--txt);font-size:13px;display:grid;place-items:center;transition:border-color .15s;
}
.pager button:hover:not(:disabled){border-color:var(--blue)}
.pager button:disabled{opacity:.35;cursor:default}
.pager .info{font-size:12px;color:var(--mut);font-family:var(--mono);padding:0 4px;white-space:nowrap}

/* ===== 表格 ===== */
.table-box{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;
}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:1080px}
thead th{
  background:var(--panel2);color:var(--mut);font-size:12px;font-weight:600;text-align:left;
  padding:10px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;position:sticky;top:0;z-index:2;
}
tbody td{
  padding:9px 10px;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--hover)}
#tbody tr[data-code]{cursor:pointer}
#tbody tr[data-code] .q-link{cursor:pointer}
tbody tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-family:var(--mono)}
.cell-code{
  display:inline-flex;align-items:center;gap:6px;cursor:pointer;border-radius:6px;
  padding:2px 6px;margin:-2px -6px;transition:background .12s;
  outline:none;
}
.cell-code:hover,.cell-code:focus-visible{background:var(--goldbg)}
.mkt{
  font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;line-height:1.5;flex:none;
}
.mkt.sz{background:var(--redbg);color:var(--red)}
.mkt.sh{background:var(--bluebg);color:var(--blue)}
.mkt.bj{background:var(--goldbg);color:var(--gold)}
.code6{font-family:var(--mono);font-size:12px;color:var(--txt)}
.q-link{display:inline-flex;align-items:center;flex:none}
.code6 .link-ico,.q-link .link-ico{width:12px;height:12px;color:var(--dim);transition:color .12s}
.q-link:hover .link-ico{color:var(--gold)}
tbody tr:hover .code6{color:var(--txt)}
.cell-name{font-weight:600}
.up{color:var(--red)} .down{color:var(--green)} .flat{color:var(--mut)}
.board-badge{
  display:inline-block;padding:2px 8px;border-radius:5px;font-size:12px;font-weight:700;
}
.board-badge.b5{background:var(--redbg);color:var(--red)}
.board-badge.b6{background:var(--redbg);color:#ff7a7f}
.board-badge.b7{background:rgba(255,176,32,.15);color:var(--gold)}
.board-badge.b8{background:rgba(255,176,32,.2);color:#ffc84d}
.board-badge.b9{background:rgba(255,176,32,.28);color:#ffd97a}
.board-badge.b10{background:rgba(255,92,120,.22);color:#ff8099}
.board-badge.bhi{background:linear-gradient(90deg,rgba(240,71,79,.35),rgba(255,176,32,.3));color:#fff}
.board-badge.bt{background:var(--bluebg);color:var(--blue)}
html[data-theme="light"] .board-badge.b6{color:#c81e28}
html[data-theme="light"] .board-badge.b7{color:#a16000}
html[data-theme="light"] .board-badge.b8{color:#8a5200}
html[data-theme="light"] .board-badge.b9{color:#7a4700}
html[data-theme="light"] .board-badge.b10{color:#c2185b}
html[data-theme="light"] .board-badge.bhi{
  background:linear-gradient(90deg,rgba(217,43,52,.20),rgba(255,176,32,.28));color:#7a2d00;
}
.gold{color:var(--gold)} .dim{color:var(--dim)}
.live-flash{animation:flash .6s}
@keyframes flash{0%{background:var(--flash)}100%{background:transparent}}
.empty-row td{text-align:center;color:var(--dim);padding:40px 0!important;white-space:normal!important}

/* ===== Toast ===== */
.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:60;
  background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:9px 16px;
  font-size:13px;color:var(--txt);box-shadow:var(--shadow);max-width:86vw;
  opacity:0;pointer-events:none;transition:opacity .25s;
}
.toast.show{opacity:1}
.toast .t-red{color:var(--red)} .toast .t-gold{color:var(--gold)}

/* ===== 页脚 ===== */
.foot{
  margin-top:16px;font-size:11px;color:var(--dim);display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between;
}
.foot .src a{color:var(--blue);border-bottom:1px dashed rgba(91,140,255,.4)}

/* ===== 响应式 ===== */
@media (min-width:1000px){
  .hide-wide{display:none!important}
}
@media (max-width:999px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .charts{grid-template-columns:1fr}
  .hide-mid{display:none}
}
@media (max-width:640px){
  .wrap{padding:0 12px 50px}
  .brand h1{font-size:17px}
  .stat .v{font-size:21px}
  .chart h3{font-size:13px}
  .hide-sm{display:none}
  .pager{width:100%;justify-content:flex-end;margin-top:2px}
  select{font-size:16px}
  .search input{font-size:16px}
  .live-toggle{font-size:12px}
  .fold-desc{display:none}
}
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== 顶栏 ===== -->
  <header class="topbar">
    <div class="brand">
      <div class="logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 3 5-8 4 6" stroke="#e8484f"/><circle cx="19.5" cy="8.5" r="1.6" fill="#ffb020" stroke="none"/></svg>
      </div>
      <div>
        <h1>A股<em>妖股榜</em> · 2021-2026</h1>
        <div class="sub">近 5 年连板妖股全量回顾 · 数据联动通达信行情</div>
      </div>
    </div>
    <div class="top-actions">
      <a class="tdx-link" href="http://hot.icfqs.com:7615/site/tdx-pc-hqpage/page-lbtt.html?color=0&amp;bkcolor=000000" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 4.9L20 7.6l-3.8 3.6.9 5.2L12 14l-5.1 2.4.9-5.2L4 7.6l5.6-.7z"/></svg>
        通达信 · 连板天梯
      </a>
      
      <button class="action-btn" id="btnImportExcel" title="选择 Table.xlsx 并生成 JSON 预览">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
        新增数据
      </button>
      <button class="action-btn" id="btnOpenDataJs" title="选择现有的 data.js 读取比对">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        打开数据源
      </button>
      <button class="action-btn" id="btnSaveDataJs" title="过滤并保存/覆盖 data.js">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        下载数据
      </button>
      
      <button class="theme-btn" id="themeBtn" type="button" title="切换明暗主题">
        <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span id="themeTxt"></span>
      </button>
    </div>
  </header>
  
  <input type="file" id="excelUpload" accept=".xlsx, .xls" style="display:none">
  <input type="file" id="jsUpload" accept=".js" style="display:none">

  <!-- ===== 数据工具面板 ===== -->
  <div class="data-panel" id="dataPanel">
    <div class="panel-head">
      <div class="panel-title">📊 数据转换与更新日志</div>
      <button class="btn-close" id="btnClosePanel">✕</button>
    </div>
    <div class="tool-log" id="toolLog">等待操作...</div>
    <div class="tool-json-box" id="toolJsonBox">
      <div class="tool-json-head">
        <span class="tool-json-title" id="toolJsonTitle">生成的数据预览：</span>
        <button class="action-btn" id="btnCopyJson" style="height:28px;padding:0 10px;font-size:12px;">一键复制</button>
      </div>
      <textarea id="toolJsonOutput" readonly></textarea>
    </div>
  </div>

  <!-- ===== 可折叠：统计卡片 + 图表 ===== -->
  <section class="overview">
    <button class="fold-head" id="foldBtn" type="button" aria-expanded="false" aria-controls="foldBody">
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      <span class="fold-title">数据概览</span>
      <span class="fold-desc">统计卡片 · 年度分布 · 连板结构</span>
      <span class="fold-tag" id="foldTag">点击展开</span>
    </button>

    <div class="fold-body" id="foldBody" hidden>
      <section class="stats" id="stats"></section>
      <section class="charts">
        <div class="chart" id="chart-year">
          <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>年度妖股数量分布</h3>
          <div class="hint" id="year-hint"></div>
          <div class="cv" id="cv-year"></div>
          <div class="fallback" id="fb-year"></div>
        </div>
        <div class="chart" id="chart-board">
          <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V4M4 8h16l-3-3M20 14H4l3 3"/></svg>连板结构 TOP12</h3>
          <div class="hint">板型出现次数排行 · 妖股连板强度</div>
          <div class="cv" id="cv-board"></div>
          <div class="fallback" id="fb-board"></div>
        </div>
      </section>
    </div>
  </section>

  <!-- ===== 工具栏 ===== -->

<script>
let DATA = null;
let stats = null;
if (window.__DATA__) {
  DATA = window.__DATA__;

/* ============ 工具函数 ============ */
const $ = (s)=>document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function fmtPct(v, sign=true){
  if(v==null||isNaN(v)) return '<span class="flat">—</span>';
  const cls = v>0.0001 ? "up" : (v<-0.0001 ? "down" : "flat");
  const s = (v>0&&sign?"+":"") + v.toFixed(2) + "%";
  return '<span class="'+cls+'">'+s+'</span>';
}
function fmtPrice(v){ return (v==null||isNaN(v)) ? '<span class="flat">—</span>' : '<span class="num">'+v.toFixed(2)+'</span>'; }
function boardClass(b, bp){
  if(String(b).indexOf("天")>-1) return "bt";
  if(bp>=12) return "bhi";
  return "b"+(bp>10?10:bp);
}
let toastTimer=null;
function toast(html, ms=3200){
  const t=$("#toast"); t.innerHTML=html; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"), ms);
}

/* ============ 状态 ============ */
const state = {
  q:"", year:"", board:"", minPlates:0,
  sort:"e_desc", page:1, pageSize:50,

/* ============ 主题切换 ============ */
const themeBtn = $("#themeBtn"), themeTxt = $("#themeTxt");
function syncThemeUI(){
  const light = document.documentElement.dataset.theme === "light";

}
themeBtn.addEventListener("click", ()=>{
  const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  document.documentElement.dataset.theme = next;
  try{ localStorage.setItem("ag-theme", next); }catch(e){}
  syncThemeUI();
  if(chartsInited && !$("#foldBody").hidden) drawCharts();
});
syncThemeUI();

/* ============ 统计卡片 ============ */
function renderStats(st){
  const items = [
    {k:"收录妖股记录", v:st.total.toLocaleString(), d:"跨 "+st.years.length+" 个年度", c:"var(--red)"},
    {k:"涉及个股", v:st.names.toLocaleString(), d:"含沪深京市场", c:"var(--blue)"},
    {k:"最高连板", v:st.max_plates, d:"出现 "+st.max_plates_count+" 次", c:"var(--gold)"},
    {k:"平均区间涨幅", v:st.avg_rc+"%", d:"妖股启动至见顶", c:"var(--green)"}
  ];
  $("#stats").innerHTML = items.map(it=>
    '<div class="stat" style="--c:'+it.c+'"><div class="k">'+it.k+'</div><div class="v">'+it.v+'</div><div class="d">'+it.d+'</div></div>'
  ).join("");
}

/* ============ 图表 ============ */
let yearChart = null, boardChart = null, chartsInited = false;
function chartTheme(){
  const light = document.documentElement.dataset.theme === "light";
  return light ? { axis:"#cbd5e1", split:"#e8edf5", text:"#64748b", label:"#334155", tipBg:"#ffffff", tipBorder:"#dbe3ee", tipText:"#1a2233", bar1:["#e5484d","rgba(229,72,77,.25)"], bar2:["rgba(217,119,6,.85)","rgba(229,72,77,.85)"] } : { axis:"#2c3750", split:"#1a2233", text:"#8b95a9", label:"#e8ebf2", tipBg:"#182034", tipBorder:"#2c3750", tipText:"#e8ebf2", bar1:["#f0474f","rgba(240,71,79,.25)"], bar2:["rgba(255,176,32,.85)","rgba(240,71,79,.85)"] };
}
function renderFallback(){
  const yh = $("#year-hint"), fbY = $("#fb-year"), fbB = $("#fb-board");
  const years = Object.keys(stats.by_year);
  const maxY = Math.max(...Object.values(stats.by_year));
  yh.textContent = "2020 年为跨年样本（2020-12 启动），2026 年统计至 10 月";
  fbY.innerHTML = years.map(y=>{
    const n = stats.by_year[y]||0;
    return '<div class="fb-row"><span class="l">'+y+'</span><span class="bar" style="width:'+Math.max(4,n/maxY*100)+'%"></span><span class="n">'+n+'</span></div>';
  }).join("");
  const maxB = stats.board_top[0].n;
  fbB.innerHTML = stats.board_top.map(b=>
    '<div class="fb-row"><span class="l">'+esc(b.b)+'</span><span class="bar" style="width:'+Math.max(4,b.n/maxB*100)+'%"></span><span class="n">'+b.n+'</span></div>'
  ).join("");
}
function setChartFallback(){
  $("#chart-year").classList.add("no-echarts"); $("#chart-board").classList.add("no-echarts"); renderFallback();
}
function drawCharts(){
  if(typeof echarts === "undefined"){ setChartFallback(); return; }
  $("#chart-year").classList.remove("no-echarts"); $("#chart-board").classList.remove("no-echarts");
  const t = chartTheme();
  if(yearChart){ yearChart.dispose(); yearChart = null; }
  if(boardChart){ boardChart.dispose(); boardChart = null; }
  yearChart = echarts.init($("#cv-year"), null, {renderer:"canvas"});
  const years = Object.keys(stats.by_year);
  yearChart.setOption({
    grid:{left:44,right:16,top:34,bottom:26}, tooltip:{trigger:"axis",backgroundColor:t.tipBg,borderColor:t.tipBorder,textStyle:{color:t.tipText,fontSize:12}},
    xAxis:{type:"category",data:years,axisLine:{lineStyle:{color:t.axis}},axisLabel:{color:t.text},axisTick:{show:false}},
    yAxis:{type:"value",splitLine:{lineStyle:{color:t.split}},axisLabel:{color:t.text}},
    series:[{type:"bar",data:years.map(y=>stats.by_year[y]||0),barWidth:"46%",itemStyle:{borderRadius:[5,5,0,0],color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:t.bar1[0]},{offset:1,color:t.bar1[1]}])},label:{show:true,position:"top",color:t.label,fontSize:11}}]
  });
  boardChart = echarts.init($("#cv-board"), null, {renderer:"canvas"});
  const tops = stats.board_top.slice(0,12).reverse();
  boardChart.setOption({
    grid:{left:64,right:42,top:14,bottom:26}, tooltip:{trigger:"axis",axisPointer:{type:"shadow"},backgroundColor:t.tipBg,borderColor:t.tipBorder,textStyle:{color:t.tipText,fontSize:12}},
    xAxis:{type:"value",splitLine:{lineStyle:{color:t.split}},axisLabel:{color:t.text}},
    yAxis:{type:"category",data:tops.map(x=>x.b),axisLine:{lineStyle:{color:t.axis}},axisLabel:{color:t.text,fontSize:12},axisTick:{show:false}},
    series:[{type:"bar",data:tops.map(x=>x.n),barWidth:12,itemStyle:{borderRadius:[0,5,5,0],color:new echarts.graphic.LinearGradient(0,0,1,0,[{offset:0,color:t.bar2[0]},{offset:1,color:t.bar2[1]}])},label:{show:true,position:"right",color:t.text,fontSize:11}}]
  });
}
window.addEventListener("resize", ()=>{ if(yearChart) yearChart.resize(); if(boardChart) boardChart.resize(); });

/* ============ 概览折叠 ============ */
const foldBtn = $("#foldBtn"), foldBody = $("#foldBody"), foldTag = $("#foldTag");
foldBtn.addEventListener("click", ()=>{
  const open = foldBtn.getAttribute("aria-expanded") !== "true";
  foldBtn.setAttribute("aria-expanded", open ? "true" : "false");
  foldBody.hidden = !open; foldTag.textContent = open ? "点击收起" : "点击展开";
  if(open){
    requestAnimationFrame(()=>{
      if(typeof echarts === "undefined"){ setChartFallback(); chartsInited = true; return; }
      if(!chartsInited){ chartsInited = true; drawCharts(); } else { if(yearChart) yearChart.resize(); if(boardChart) boardChart.resize(); }
    });
  }
});

/* ============ 筛选 / 排序 / 分页 ============ */
function filtered(){
  const q = state.q.trim().toLowerCase();
  let out = DATA.rows.filter(r=>{
    if(state.year && String(r.s||"").slice(0,4)!==state.year) return false;
    if(state.board && r.b!==state.board) return false;
    if(state.minPlates && (r.bp||0) < state.minPlates) return false;
    if(q){
      const c = String(r.c||"").toLowerCase();
      const n = String(r.n||"").toLowerCase();
      return c.indexOf(q)>-1 || n.indexOf(q)>-1;
    }
    return true;
  });
  const cmp = {
    e_desc:(a,b)=> String(b.e||"").localeCompare(String(a.e||"")),
    rc_desc:(a,b)=> (b.rc??-1)-(a.rc??-1),
    bp_desc:(a,b)=> (b.bp??0)-(a.bp??0),
    chg_desc:(a,b)=> (b.chg??-999)-(a.chg??-999),
    se_desc:(a,b)=> (b.se??-999)-(a.se??-999)
  }[state.sort];
  if(cmp) out = [...out].sort(cmp);
  return out;
}
function renderTable(){
  const list = filtered();
  const totalPages = Math.max(1, Math.ceil(list.length/state.pageSize));
  if(state.page>totalPages) state.page = totalPages;
  const start = (state.page-1)*state.pageSize;
  const rows = list.slice(start, start+state.pageSize);
  const tb = $("#tbody");
  if(!rows.length){
    tb.innerHTML = '<tr class="empty-row"><td colspan="12">没有符合条件的妖股记录，换个筛选试试</td></tr>';
  } else {
    tb.innerHTML = rows.map((r,i)=>{
      const idx = start + i; const code = esc(r.c); const mkt = esc(r.m);
      const em = "https://quote.eastmoney.com/"+mkt+r.c+".html";
      return '<tr data-i="'+idx+'" data-code="'+code+'" data-mkt="'+mkt+'">'
        + '<td class="c-code">'
        +   '<span class="cell-code" role="button" tabindex="0" title="点击联动通达信（Shift+点击=强制模式）">'
        +     '<span class="mkt '+mkt+'">'+mkt.toUpperCase()+'</span>'
        +     '<span class="code6">'+code+'</span>'
        +   '</span>'
        +   '<a class="q-link" href="'+em+'" target="_blank" rel="noopener" title="打开东方财富行情">'
        +     '<svg class="link-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/></svg>'
        +   '</a>'
        + '</td>'
        + '<td class="cell-name">'+esc(r.n)+'</td>'
        + '<td class="num"><span class="px" data-c="'+code+'">'+fmtPrice(r.p)+'</span></td>'
        + '<td class="num"><span class="chg" data-c="'+code+'">'+fmtPct(r.chg)+'</span></td>'
        + '<td>'+(r.s||"—")+'</td><td>'+(r.e||"—")+'</td>'
        + '<td><span class="board-badge '+boardClass(r.b,r.bp)+'">'+esc(r.b)+'</span></td>'
        + '<td class="num">'+fmtPct(r.rc)+'</td>'
        + '<td class="num">'+fmtPct(r.se)+'</td>'
        + '<td class="num hide-mid">'+fmtPct(r.mc)+'</td>'
        + '<td class="hide-sm">'+(r.g?'<span class="gold">'+r.g+'</span>':'<span class="dim">—</span>')+'</td>'
        + '<td class="hide-sm dim">'+(r.t||"—")+'</td></tr>';
    }).join("");
  }
  $("#pg-info").textContent = (list.length? (start+1)+"-"+(start+rows.length)+" / " : "0 / ")+list.length+" 条";
  $("#pg-prev").disabled = state.page<=1; $("#pg-next").disabled = state.page>=totalPages;
  if(state.live && !state.liveFail) fetchLive(rows);
}
function updateFilters(){
  const ySel = $("#f-year"), bSel = $("#f-board");
  const years = [...new Set(DATA.rows.map(r=>String(r.s||"").slice(0,4)).filter(Boolean))].sort();
  ySel.innerHTML = '<option value="">全部年份</option>'+years.map(y=>'<option value="'+(y==="2020"?"2020*":y)+'">'+(y==="2020"?"2020*":y)+'</option>').join("");
  const boards = [...new Set(DATA.rows.map(r=>r.b))].sort((a,b)=>{
    const na = Number(String(a).match(/\d+/)?.[0]||0); const nb = Number(String(b).match(/\d+/)?.[0]||0); return nb-na;
  });
  bSel.innerHTML = '<option value="">全部板型</option>'+boards.map(b=>'<option value="'+esc(b)+'">'+esc(b)+'</option>').join("");
  if(state.year) ySel.value = (state.year==="2020")?"2020*":state.year; if(state.board) bSel.value = state.board;
}

/* ============ 通达信联动 ============ */
const TDX_ORIGIN = "http://www.treeid/code_";
let tdxFrameEl = null;
function getTdxFrame(){
  if(tdxFrameEl && tdxFrameEl.parentNode) return tdxFrameEl;
  tdxFrameEl = document.createElement("iframe"); tdxFrameEl.id = "tdx-bridge"; tdxFrameEl.title = "通达信联动";
  tdxFrameEl.setAttribute("aria-hidden","true");
  tdxFrameEl.style.cssText = "position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;border:0;opacity:0;pointer-events:none;";
  document.body.appendChild(tdxFrameEl); return tdxFrameEl;
}
function tdxJump(code, force){
  if(!code) return; const url = TDX_ORIGIN + code;
  if(force){ try{ window.location.href = url; return; }catch(err){ console.warn("强制联动失败", err); } }
  try{
    const f = getTdxFrame(); f.src = "about:blank";
    setTimeout(()=>{ try{ f.src = url; }catch(err){ console.warn("通达信联动失败", err); } }, 10);
  }catch(err){ console.warn("通达信联动失败", err); }
  toast('已联动通达信：<span class="t-gold">'+esc(code)+'</span>　<span class="dim">未切换？按 Shift 再点一次，或点代码右侧 ↗ 打开网页行情</span>', 3400);
}
function activateRow(tr, e){
  if(!tr) return; if(e.target.closest(".q-link")) return;
  const sel = window.getSelection(); if(sel && String(sel).length > 0) return;
  e.preventDefault(); tdxJump(tr.dataset.code, e.shiftKey);
}
document.addEventListener("click", e=>{ const tr = e.target.closest("#tbody tr[data-code]"); if(!tr) return; activateRow(tr, e); });
document.addEventListener("keydown", e=>{
  if(e.key !== "Enter" && e.key !== " ") return;
  const tr = e.target.closest("#tbody tr[data-code]"); if(!tr) return;
  e.preventDefault(); tdxJump(tr.dataset.code, e.shiftKey);
});

/* ============ 实时行情 ============ */
function fetchLive(rows){
  const codes = rows.map(r=>r.m+r.c).filter(Boolean); if(!codes.length) return;
  const s = document.createElement("script"); let done = false; window.__qt = window.__qt || {};
  s.src = "https://qt.gtimg.cn/q="+codes.join(",");
  const timer = setTimeout(()=>{ if(!done){ done = true; liveDown(); } }, 7000);
  s.onerror = ()=>{ if(!done){ done = true; clearTimeout(timer); liveDown(); } };
  s.onload = ()=>{
    if(done) return; done = true; clearTimeout(timer);
    codes.forEach(c=>{
      const v = window["v_"+c]; if(typeof v !== "string") return;
      const p = v.split("~"); if(p.length < 33) return;
      const price = parseFloat(p[3]), pct = parseFloat(p[32]); const code6 = c.slice(2);
      if(!isNaN(price)){ document.querySelectorAll('.px[data-c="'+code6+'"]').forEach(el=>{ el.innerHTML = fmtPrice(price); flash(el); }); }
      if(!isNaN(pct)){ document.querySelectorAll('.chg[data-c="'+code6+'"]').forEach(el=>{ el.innerHTML = fmtPct(pct); flash(el); }); }
    });
  };
  document.body.appendChild(s);
}
function flash(el){ el.classList.remove("live-flash"); void el.offsetWidth; el.classList.add("live-flash"); }
let liveFailShown = false;
function liveDown(){
  state.liveFail = true; state.live = false;
  if(state.liveTimer){ clearInterval(state.liveTimer); state.liveTimer = null; }
  $("#live").classList.remove("on"); $("#live-st").textContent = "已关闭";
  if(!liveFailShown){
    liveFailShown = true;
    toast('实时行情暂不可用，表格展示表内静态数据。<span class="t-gold">可点击代码联动通达信，或点 ↗ 打开行情网页</span>', 5000);
  }
}
function toggleLive(on){
  state.live = on; $("#live").classList.toggle("on", on); $("#live-st").textContent = on ? "已开启" : "已关闭";
  if(on && !state.liveFail){
    const rows = Array.from(document.querySelectorAll("#tbody tr[data-code]")).slice(0,state.pageSize).map(tr=>({c:tr.dataset.code, m:tr.dataset.mkt}));
    fetchLive(rows);
    if(!state.liveTimer) state.liveTimer = setInterval(()=>{
      if(state.live && !state.liveFail){
        const r2 = Array.from(document.querySelectorAll("#tbody tr[data-code]")).slice(0,state.pageSize).map(tr=>({c:tr.dataset.code, m:tr.dataset.mkt}));
        fetchLive(r2);
      }
    }, 60000);
  } else if(!on && state.liveTimer){ clearInterval(state.liveTimer); state.liveTimer = null; }
}

/* ============ 事件绑定 ============ */
$("#q").addEventListener("input", e=>{ state.q = e.target.value; state.page=1; renderTable(); });
$("#f-year").addEventListener("change", e=>{ state.year = e.target.value.replace("*",""); state.page=1; renderTable(); });
$("#f-board").addEventListener("change", e=>{ state.board = e.target.value; state.page=1; renderTable(); });
$("#f-plates").addEventListener("change", e=>{ state.minPlates = +e.target.value||0; state.page=1; renderTable(); });
$("#sort").addEventListener("change", e=>{ state.sort = e.target.value; state.page=1; renderTable(); });
$("#pg-prev").addEventListener("click", ()=>{ if(state.page>1){ state.page--; renderTable(); } });
$("#pg-next").addEventListener("click", ()=>{ state.page++; renderTable(); });
$("#live").addEventListener("click", ()=> toggleLive(!state.live));

// 极其强大的日期清洗
function getCleanDate(val) {
  if (!val) return '';
  let str = String(val).trim();
  if (/^\d+(\.\d+)?$/.test(str)) {
      const d = new Date(Math.round((Number(str) - 25569) * 86400 * 1000));
      if (!isNaN(d.getTime())) {
          return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      }
  }
  str = str.replace(/[\/\.年]/g, '-').replace(/月/g, '-').replace(/日/g, '').trim();
  const parts = str.split('-');
  if (parts.length >= 3) {
      let p1 = parts[0].trim(), p2 = parts[1].trim().padStart(2, '0'), p3 = parts[2].trim().substring(0, 2).padStart(2, '0');
      if (p1.length === 4) return `${p1}-${p2}-${p3}`;
      if (p1.length <= 2 && p3.length === 2) {
          let month = p1.padStart(2, '0'), day = p2.padStart(2, '0'), year = "20" + p3;
          if (parseInt(month) > 12) { let tmp = month; month = day; day = tmp; }
          return `${year}-${month}-${day}`;
      }
  }
  return str; 
}

// 单行转换
function parseRowToRecord(row) {
  const fullCode = String(row.rawCode || '').trim().toUpperCase();
  let m, c;
  if (fullCode.startsWith('SH') || fullCode.startsWith('SZ') || fullCode.startsWith('BJ')) {
    m = fullCode.substring(0, 2).toLowerCase(); c = fullCode.substring(2);
  } else {
    c = fullCode; m = c.startsWith('6') ? 'sh' : 'sz';
  }
  const boardStr = String(row.rawB || '').trim();
  let bd = 0, bp = 0;
  if (boardStr.includes('天')) {
    const match = boardStr.match(/(\d+)天(\d+)板/);
    if (match) { bd = parseInt(match[1]); bp = parseInt(match[2]); }
  } else if (boardStr.includes('连板')) {
    const match = boardStr.match(/(\d+)连板/);
    if (match) { bd = parseInt(match[1]); bp = parseInt(match[1]); }
  }
  const parseNum = (val) => (val === undefined || val === null || val === '') ? 0 : (parseFloat(String(val).replace(/[+%\s]/g, '')) || 0);
  const startDate = getCleanDate(row.rawS);
  return {
    "c": c, "m": m, "n": String(row.rawName).trim(),
    "p": parseFloat(String(row.rawPrice).replace(/[^\d.-]/g, '')) || 0,
    "chg": parseNum(row.rawChg), "s": startDate, "e": getCleanDate(row.rawE),
    "b": boardStr, "bd": bd, "bp": bp, "rc": parseNum(row.rawRc), 
    "se": parseNum(row.rawSe), "mc": parseNum(row.rawMc), "g": startDate, "t": "09:30"
  };
}

// =========================================================
// 新增：获取15分钟K线并计算MACD金叉
// =========================================================
function fetchKlineData(secid) {
  return new Promise((resolve, reject) => {
    const callbackName = 'jsonp_cb_' + Math.random().toString(36).substr(2, 9);
    window[callbackName] = function(data) {
      delete window[callbackName];
      if (document.body.contains(script)) document.body.removeChild(script);
      resolve(data);
    };
    const script = document.createElement('script');
    script.src = `https://push2his.eastmoney.com/api/qt/stock/kline/get?cb=${callbackName}&secid=${secid}&klt=15&fqt=1&fields1=f1,f2,f3,f4,f5,f6&fields2=f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61&beg=0&end=20500101&lmt=500`;
    script.onerror = function() {
      delete window[callbackName];
      if (document.body.contains(script)) document.body.removeChild(script);
      reject(new Error('JSONP request failed'));
    };
    document.body.appendChild(script);
  });
}

function calculateMACD(closes) {
  if (closes.length < 26) return null;
  const ema12 = [], ema26 = [], dif = [], dea = [], macd = [];
  let prevEma12 = closes[0], prevEma26 = closes[0];
  ema12.push(prevEma12); ema26.push(prevEma26);
  for (let i = 1; i < closes.length; i++) {
    prevEma12 = (2 * closes[i] + 11 * prevEma12) / 13;
    prevEma26 = (2 * closes[i] + 25 * prevEma26) / 27;
    ema12.push(prevEma12); ema26.push(prevEma26);
  }
  for (let i = 0; i < closes.length; i++) {
    dif.push(ema12[i] - ema26[i]);
  }
  let prevDea = dif[0];
  dea.push(prevDea);
  for (let i = 1; i < dif.length; i++) {
    prevDea = (2 * dif[i] + 8 * prevDea) / 10;
    dea.push(prevDea);
    macd.push(2 * (dif[i] - prevDea));
  }
  const crosses = [];
  for (let i = 1; i < dif.length; i++) {
    if (dif[i-1] <= dea[i-1] && dif[i] > dea[i]) {
      crosses.push(i);
    }
  }
  return { crosses, dates: null };
}

async function getMacdGoldenCrossDates(code, market) {
  let secid = '';
  if (market === 'sh') secid = '1.' + code;
  else if (market === 'sz') secid = '0.' + code;
  else if (market === 'bj') secid = '0.' + code; // 北交所暂时用0
  try {
    const data = await fetchKlineData(secid);
    if (!data || !data.data || !data.data.klines) return [];
    const klines = data.data.klines;
    const closes = klines.map(k => parseFloat(k.split(',')[2]));
    const dates = klines.map(k => k.split(',')[0].split(' ')[0]);
    const times = klines.map(k => k.split(',')[0].split(' ')[1]);
    const macdRes = calculateMACD(closes);
    if (!macdRes || !macdRes.crosses) return [];
    return macdRes.crosses.map(idx => ({
      date: dates[idx],
      time: times[idx]
    }));
  } catch (e) {
    console.warn(`获取 ${code} K线失败:`, e);
    return [];
  }
}

// 1. 点击“新增数据”
btnImportExcel.addEventListener('click', () => excelUpload.click());
excelUpload.addEventListener('change', (e) => {
  const file = e.target.files[0]; if (!file) return;
  dataPanel.style.display = 'block'; toolLog.innerHTML = ''; toolJsonBox.style.display = 'none';
  writeLog(`正在解析 Excel: ${file.name} ...`, 'info');

  const reader = new FileReader();
  reader.onload = (evt) => {
    try {
      const data = new Uint8Array(evt.target.result);
      const workbook = XLSX.read(data, { type: 'array', cellDates: true });
      const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
      const rawRows = XLSX.utils.sheet_to_json(firstSheet, { header: 1, raw: false });
      
      let headerIndex = 0;
      for (let i = 0; i < Math.min(rawRows.length, 10); i++) {
        if (!rawRows[i]) continue;
        const rowStr = rawRows[i].map(c => String(c || '')).join('').replace(/[\s\u3000]+/g, '');
        if (rowStr.includes('代码')) { headerIndex = i; break; }
      }
      if (!rawRows[headerIndex]) { writeLog("❌ 失败：读取到的 Excel 内容为空。", 'error'); return; }

      const headers = rawRows[headerIndex].map(h => String(h || '').replace(/[\s\u3000]+/g, ''));
      const findCol = (keywords) => {
        for (let i = 0; i < headers.length; i++) {
          for (let kw of keywords) { if (headers[i].includes(kw)) return i; }
        }
        return -1;
      };

      const colCode = findCol(['代码']), colName = findCol(['名称']), colPrice = findCol(['现价']), colChg = findCol(['今日涨幅']);
      const colS = findCol(['开始时间', '开始日期']), colE = findCol(['结束时间', '结束日期']), colB = findCol(['几天几板']);
      const colRc = findCol(['个股区间涨幅', '区间涨幅']), colSe = findCol(['结束至今涨幅', '结束至今']), colMc = findCol(['大盘区间涨幅', '大盘区间']);

      if (colCode === -1 || colS === -1) { writeLog(`❌ 失败：找不到必要列（代码/开始时间）。`, 'error'); return; }

      excelData = [];
      for (let i = headerIndex + 1; i < rawRows.length; i++) {
        const row = rawRows[i];
        if (!row || row.length === 0 || !row[colCode]) continue;
        excelData.push({
          rawCode: row[colCode], rawName: row[colName], rawPrice: row[colPrice], rawChg: row[colChg],
          rawS: row[colS], rawE: row[colE], rawB: row[colB], rawRc: row[colRc], rawSe: row[colSe], rawMc: row[colMc]
        });
      }
      
      writeLog(`✅ Excel 解析成功，提取出 ${excelData.length} 行原始数据。`, 'success');
      
      const allRecords = excelData.map(r => parseRowToRecord(r));
      const prettyJson = `[\n${allRecords.map(r => JSON.stringify(r)).join(',\n')}\n]`;
      toolJsonOutput.value = prettyJson;
      toolJsonTitle.innerText = `全量转换预览 (共 ${allRecords.length} 条)：`;
      toolJsonBox.style.display = 'block';
      writeLog(`💡 已生成全量转换 JSON，可点击“一键复制”。请继续点击“打开数据源”进行比对过滤。`, 'info');

    } catch (err) { writeLog(`❌ Excel 读取异常: ${err.message}`, 'error'); }
  };
  reader.readAsArrayBuffer(file);
});

// 2. 点击“打开数据源”
btnOpenDataJs.addEventListener('click', () => jsUpload.click());
jsUpload.addEventListener('change', (e) => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    jsContent = evt.target.result;
    if (!jsContent.includes('"rows"')) { writeLog(`❌ 文件格式不对，找不到 rows 结构！`, 'error'); return; }
    writeLog(`✅ data.js 读取成功（${file.name}）。`, 'success');
    writeLog(`💡 请点击右侧的“下载数据”按钮，执行最终过滤与覆盖。`, 'info');
  };
  reader.readAsText(file, 'UTF-8');
});

// 3. 点击“下载数据” (集成MACD查询)
btnSaveDataJs.addEventListener('click', async () => {
  if (!excelData) { toast("请先点击【新增数据】选择 Table.xlsx"); return; }
  if (!jsContent) { toast("请先点击【打开数据源】选择 data.js"); return; }
  
  dataPanel.style.display = 'block';
  writeLog(`\n⏳ 开始执行最终过滤与比对...`, 'info');

  let existingRows = [];
  try {
    let jsonStr = jsContent.replace(/^[\s\S]*?window\.__DATA__\s*=\s*/, '').replace(/;\s*$/, '');
    existingRows = (JSON.parse(jsonStr)).rows || [];
    writeLog(`🔍 当前 data.js 中已存在 ${existingRows.length} 条记录。`, 'info');
  } catch (err) {
    writeLog(`⚠️ 无法解析原 data.js，采用正则降级提取。`, 'warn');
    const regex = /"c":"(\d+)","m":"[^"]+","n":"[^"]+","p":[^,]+,"chg":[^,]+,"s":"(\d{4}-\d{2}-\d{2})"/g;
    let match; while ((match = regex.exec(jsContent)) !== null) { existingRows.push({ c: match[1], s: match[2] }); }
  }

  const existingKeys = new Set(existingRows.map(r => `${r.c}_${r.s}`));
  const finalRecords = [];
  let skipByDate = 0, skipByDuplicate = 0;
  const targetTimestamp = new Date('2026-10-09T23:59:59').getTime();

  const newRecordsToProcess = [];
  excelData.forEach((row) => {
    const record = parseRowToRecord(row);
    const startDate = record.s;
    if (!record.c || !startDate || startDate.length < 10) return;

    const st = new Date(startDate).getTime();
    if (isNaN(st) || st <= targetTimestamp) { skipByDate++; return; }
    const uk = `${record.c}_${startDate}`;
    if (existingKeys.has(uk)) { skipByDuplicate++; return; }
    newRecordsToProcess.push(record);
    existingKeys.add(uk);
  });

  if (skipByDate > 0) writeLog(`⏭️ 已过滤掉 ${skipByDate} 条时间不符合（≤2026-10-09）的记录。`, 'warn');
  if (skipByDuplicate > 0) writeLog(`⏭️ 已过滤掉 ${skipByDuplicate} 条重复记录。`, 'warn');

  if (newRecordsToProcess.length === 0) {
    writeLog("⚠️ 没有找到符合条件的新增记录，未生成新文件。", 'warn');
    toolJsonBox.style.display = 'none'; return;
  }

  writeLog(`✨ 发现 ${newRecordsToProcess.length} 条潜在新增记录，正在查询15分钟MACD金叉...`, 'info');

  // 查询MACD并匹配
  for (let i = 0; i < newRecordsToProcess.length; i++) {
    const record = newRecordsToProcess[i];
    writeLog(`[${i+1}/${newRecordsToProcess.length}] 正在查询 ${record.c} ${record.n} 的15分钟K线...`, 'info');
    
    const crosses = await getMacdGoldenCrossDates(record.c, record.m);
    let matchedG = '';
    let matchedT = '';
    
    for (const cross of crosses) {
      if (cross.date === record.s) {
        matchedG = cross.date;
        matchedT = cross.time;
        break;
      }
    }
    
    record.g = matchedG;
    record.t = matchedT;
    
    if (matchedG) {
      writeLog(`  ✅ 匹配到金叉: ${matchedG} ${matchedT}`, 'success');
    } else {
      writeLog(`  ⚠️ 未匹配到对应日期的金叉，留空。`, 'warn');
    }
  }

  finalRecords.push(...newRecordsToProcess);

  writeLog(`✨ 最终确认 ${finalRecords.length} 条新增记录！`, 'success');
  
  const finalJsonStr = `[\n${finalRecords.map(r => JSON.stringify(r)).join(',\n')}\n]`;
  toolJsonOutput.value = finalJsonStr;
  toolJsonTitle.innerText = `最终插入的新记录 JSON (共 ${finalRecords.length} 条)：`;
  toolJsonBox.style.display = 'block';

  const newJsonStr = finalRecords.map(r => JSON.stringify(r)).join(',\n');
  let updatedJs = jsContent.replace(/"rows"\s*:\s*\[/, `"rows":[\n${newJsonStr},`);
  if (updatedJs === jsContent) { writeLog(`❌ 注入失败：请检查 data.js 源码格式。`, 'error'); return; }

  const blob = new Blob([updatedJs], { type: 'text/javascript;charset=utf-8' });

  if (window.showSaveFilePicker) {
    try {
      if (!fileHandle) {
        fileHandle = await window.showSaveFilePicker({
          suggestedName: 'data.js',
          types: [{ description: 'JavaScript Files', accept: { 'text/javascript': ['.js'] } }],
        });
      }
      const writable = await fileHandle.createWritable();
      await writable.write(blob);
      await writable.close();
      writeLog('🎉 新的 data.js 已成功静默覆盖！请直接刷新页面生效。', 'success');
      toast('✅ 数据保存成功！');
      
      DATA.rows = [...finalRecords, ...DATA.rows];
      updateFilters(); renderTable();
      return;
    } catch (err) {
      if (err.name === 'AbortError') { writeLog('⚠️ 您取消了保存。', 'warn'); return; }
      writeLog(`⚠️ 无法直接静默写入，降级为下载模式。`, 'warn');
    }
  }

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'data.js';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  writeLog('🎉 新的 data.js 已触发下载。请手动覆盖原文件。', 'success');
});

$("#btnClosePanel").addEventListener('click', () => { dataPanel.style.display = 'none'; });
$("#btnCopyJson").addEventListener('click', () => {
  if (!toolJsonOutput.value) return;
  navigator.clipboard.writeText(toolJsonOutput.value).then(() => {
    const btn = $("#btnCopyJson");

    setTimeout(() => { btn.innerText = originalText; btn.style.background = ''; }, 2000);
  }).catch(() => alert('复制失败，请手动全选复制。'));
});

renderStats(stats);
updateFilters();
renderTable();
if(state.live) toggleLive(true);
